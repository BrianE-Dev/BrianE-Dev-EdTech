services:
  - type: web
    name: briane-dev-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run server:start
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: development
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_BASE_URL
        value: https://api.paystack.co
